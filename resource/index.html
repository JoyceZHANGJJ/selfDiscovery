<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自我觉察</title>
<style>
/* 主题：暖沙（默认） · 薄荷 · 雾蓝 · 薰衣草 · 石墨 · 湖青
   形态由下面「组件形态」段统一定义，主题只换配色 */
:root{
  --bg:#FAF8F4; --surface:#FFFFFF; --soft:#F5F2EA; --line:#EAE5DC; --line2:#E0DACF;
  --ink:#33322D; --ink2:#5A574F; --ink3:#8B8779; --ink4:#AAA598;
  --ring:0 0 0 3px rgba(124,154,134,.14);
  --accent:#7C9A86; --accent-soft:#EDF3EE; --danger:#C0574F;
  --c-obs:#7C9A86; --c-now:#5E9A94; --c-want:#C0A05A; --c-nope:#948AA8; --c-done:#6E8CB0;
  --r-card:16px; --r-btn:12px; --r-in:14px;
}
/* 暖沙（默认，与 :root 同值） */
[data-theme="sand"]{
  --bg:#FAF8F4; --surface:#FFFFFF; --soft:#F5F2EA; --line:#EAE5DC; --line2:#E0DACF;
  --ink:#33322D; --ink2:#5A574F; --ink3:#8B8779; --ink4:#AAA598;
  --ring:0 0 0 3px rgba(124,154,134,.14);
  --accent:#7C9A86; --accent-soft:#EDF3EE; --danger:#C0574F;
  --c-obs:#7C9A86; --c-now:#5E9A94; --c-want:#C0A05A; --c-nope:#948AA8; --c-done:#6E8CB0;
}
/* 薄荷 */
[data-theme="mint"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F4F5F5; --line:#EDEDED; --line2:#E3E3E3;
  --ink:#22252A; --ink2:#4A4E54; --ink3:#8A8F94; --ink4:#AAB0B5;
  --ring:0 0 0 3px rgba(47,143,123,.12);
  --accent:#2F8F7B; --accent-soft:#E6F4F0; --danger:#C0574F;
  --c-obs:#4FA894; --c-now:#4E8FB5; --c-want:#C89A3C; --c-nope:#8A7BB0; --c-done:#5C86B8;
}
/* 雾蓝 */
[data-theme="mist"]{
  --bg:#F6F8FA; --surface:#FFFFFF; --soft:#EEF1F5; --line:#E3E8EE; --line2:#D8DEE6;
  --ink:#26292E; --ink2:#4C525A; --ink3:#7C848F; --ink4:#A2A9B2;
  --ring:0 0 0 3px rgba(62,124,177,.13);
  --accent:#3E7CB1; --accent-soft:#E8F0F8; --danger:#B4544E;
  --c-obs:#4A85B5; --c-now:#5E9AA8; --c-want:#C2935A; --c-nope:#8B84AC; --c-done:#5E86B2;
}
/* 薰衣草 */
[data-theme="lav"]{
  --bg:#F8F7FB; --surface:#FFFFFF; --soft:#F1EEF8; --line:#E7E3F0; --line2:#DBD5E8;
  --ink:#292632; --ink2:#4E4A5A; --ink3:#837E92; --ink4:#A8A3B5;
  --ring:0 0 0 3px rgba(124,107,168,.13);
  --accent:#7C6BA8; --accent-soft:#EFEBF8; --danger:#B0504E;
  --c-obs:#8A79B0; --c-now:#6B86B8; --c-want:#C0984A; --c-nope:#A87BA0; --c-done:#5E86B2;
}
/* 石墨（无彩色） */
[data-theme="graph"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F3F3F3; --line:#EBEBEB; --line2:#E0E0E0;
  --ink:#1F1F1F; --ink2:#4A4A4A; --ink3:#8A8A8A; --ink4:#AEAEAE;
  --ring:0 0 0 3px rgba(79,84,89,.12);
  --accent:#4F5459; --accent-soft:#ECEEF0; --danger:#B4544E;
  --c-obs:#5B7C6B; --c-now:#5A7A8C; --c-want:#A89055; --c-nope:#7A7290; --c-done:#5E7A96;
}
/* 湖青 */
[data-theme="teal"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#EFF5F6; --line:#E3EDEC; --line2:#D6E5E4;
  --ink:#20282A; --ink2:#465356; --ink3:#7F9092; --ink4:#A6B4B6;
  --ring:0 0 0 3px rgba(46,139,154,.13);
  --accent:#2E8B9A; --accent-soft:#E6F3F5; --danger:#B4544E;
  --c-obs:#3E97A0; --c-now:#4E8FB5; --c-want:#C2934A; --c-nope:#8A7BB0; --c-done:#5C86B8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
input::placeholder,textarea::placeholder{color:var(--ink4);font-size:13px;font-weight:400;letter-spacing:.01em;opacity:1}
body{background:#EDEAE1;color:var(--ink);-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;line-height:1.6}
.wrap{max-width:1280px;margin:0 auto;padding:30px 22px 90px}

/* ---------- 页头 ---------- */
header{margin-bottom:28px}
.eyebrow{font-size:11.5px;letter-spacing:.18em;color:var(--accent);font-weight:800}
header h1{font-size:29px;font-weight:800;margin:7px 0 9px;letter-spacing:-.015em}
.lede{font-size:15px;color:var(--ink2);max-width:820px}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.meta span{font-size:11.5px;background:#fff;border:1px solid var(--line2);color:var(--ink2);padding:4px 11px;border-radius:99px}

/* ---------- 舞台 ---------- */
.stage{display:grid;grid-template-columns:404px 1fr;gap:26px;align-items:start;margin-bottom:40px}
@media(max-width:1000px){.stage{grid-template-columns:1fr}}
.phone-shell{background:#26261F;border-radius:38px;padding:11px;box-shadow:0 20px 48px rgba(35,35,31,.20),0 3px 10px rgba(35,35,31,.08);position:sticky;top:22px}
.notch{width:112px;height:20px;background:#26261F;border-radius:0 0 12px 12px;margin:-11px auto 5px;position:relative}
.notch::after{content:'';position:absolute;left:50%;top:7px;transform:translateX(-50%);width:46px;height:4.5px;background:#46463C;border-radius:99px}
.screen{height:748px;background:var(--bg);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.statusbar{padding:9px 20px 3px;display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;flex-shrink:0}
.body{flex:1;overflow-y:auto;padding:8px 12px 8px;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{width:5px}
.body::-webkit-scrollbar-thumb{background:#DAD6CA;border-radius:3px}

/* 手机内组件 */
.greet{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:6px 0 2px}
.greet-sub{font-size:12.5px;color:var(--ink3);margin-bottom:18px}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin:0 -4px}
.composer:focus-within{border-color:var(--accent);box-shadow:var(--ring)}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.sg{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--ink2);cursor:pointer;border:1px solid transparent}
.sg:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.big-in{width:100%;border:0;outline:none;resize:none;font-size:17px;font-family:inherit;color:var(--ink);background:transparent;resize:none;line-height:1.55;min-height:36px;caret-color:var(--accent)}
.tagrow{display:flex;gap:14px;margin:2px 0 0;flex-wrap:wrap;align-items:center}
.tg{font-size:12.5px;padding:5px 12px;border-radius:99px;border:1px solid var(--line2);background:#fff;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tg .dot{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.tg.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tg.on .dot{background:currentColor}
.spacer{flex:1}
.extra{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);display:none}
.extra.on{display:block}
.ehead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
.ehead .et{font-size:11.5px;color:var(--ink3);letter-spacing:.04em}
.qrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:11px 0 6px}
.qrow:first-child{margin-top:0}
.qrow .ql{font-size:12px;color:var(--ink3)}
.qrow .mg{font-size:11.5px;color:var(--ink3);cursor:pointer;border:1px solid var(--line2);border-radius:99px;padding:1px 9px;background:#fff;flex-shrink:0}
.qrow .mg:hover{color:var(--accent);border-color:var(--accent)}
.freezeline{margin-top:9px;background:var(--accent-soft);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.freezeline .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.freezeline .tb{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline;flex-shrink:0}
.q{font-size:12px;color:var(--ink3);margin:9px 0 6px}
.q:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:6px 13px;border-radius:99px;border:1px solid var(--line2);background:#fff;color:var(--ink);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(30,111,92,.28)}
.mini-in{width:100%;resize:none;border:1px solid transparent;border-radius:11px;padding:7px 11px;font-size:13.5px;font-family:inherit;outline:none;background:var(--soft);color:var(--ink);caret-color:var(--accent);transition:background .15s,border-color .15s,box-shadow .15s}
.mini-in:focus{background:#fff;border-color:var(--accent);box-shadow:var(--ring)}
.savebar{display:flex;align-items:center;gap:10px;margin-top:12px}
.btn{flex:1;padding:11px 0;border-radius:var(--r-btn);background:var(--accent);color:#fff;font-size:14.5px;font-weight:700;border:0;cursor:pointer;text-align:center;transition:opacity .15s}
.btn:active{opacity:.88}
.toastline{margin-top:13px;background:var(--accent-soft);border-radius:12px;padding:10px 13px;font-size:13px;color:var(--ink2);display:none;align-items:center;gap:8px}
.toastline.on{display:flex}
.toastline .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toastline .tb{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline;flex-shrink:0}

/* 看 · 时间线 */
.sect-t{font-size:13px;font-weight:800;color:var(--ink2);margin:16px 0 9px;letter-spacing:.02em}
.search{width:100%;border:1px solid var(--line2);border-radius:var(--r-in);padding:9px 13px;font-size:14px;font-family:inherit;outline:none;background:#fff;caret-color:var(--accent);transition:border-color .15s,box-shadow .15s}
.search:focus{border-color:var(--accent);box-shadow:var(--ring)}
.filters{display:flex;gap:6px;margin:11px 0 4px;flex-wrap:wrap}
.ft{font-size:12.5px;padding:5px 12px;border-radius:99px;border:1px solid var(--line2);background:#fff;color:var(--ink2);cursor:pointer}
.ft.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ft .fd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink3);margin-right:5px;vertical-align:middle}
.ft.on .fd{background:#fff}
.daylab{font-size:11.5px;color:var(--ink3);margin:15px 0 2px;letter-spacing:.06em}
.rec{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);position:relative}
.rec .bar{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0;min-height:22px}
.rec .ct{flex:1;min-width:0}
.rec .t1{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.55;word-break:break-all}
.rec .t2{font-size:12px;color:var(--ink3);margin-top:3px;font-variant-numeric:tabular-nums}
.rec .ops{display:flex;gap:7px;flex-shrink:0;opacity:0;transition:opacity .15s}
.rec:hover .ops{opacity:1}
.rec .ops.always{opacity:1}
.mini-b{font-size:11.5px;color:var(--ink3);border:1px solid var(--line2);background:#fff;border-radius:99px;padding:4px 11px;cursor:pointer;transition:color .15s,border-color .15s}
.mini-b.del{color:var(--danger);border-color:#E5C9C7}
.st-sum{font-size:12.5px;color:var(--ink2);margin-bottom:11px}
.st-sum b{color:var(--ink);font-weight:800}
.st-ex{font-size:12px;color:var(--ink3);margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}

/* 回看 */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.kpi .n{font-size:27px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-size:11.5px;color:var(--ink3);margin-top:2px}
.bars{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.brow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.brow .bn{flex:0 0 74px;color:var(--ink2);font-size:12.5px}
.brow .bb{flex:1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.brow .bf{height:100%;border-radius:99px}
.brow .bv{flex:0 0 26px;text-align:right;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.insight{margin-top:15px;background:var(--accent-soft);border-radius:var(--r-card);padding:16px}
.insight .it{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.04em}
.insight .ib{font-size:15px;font-weight:700;color:var(--ink);margin-top:5px;line-height:1.5}
.insight .is{font-size:12.5px;color:var(--ink2);margin-top:4px}
.heat{display:flex;gap:3px;margin-top:12px}
.heat i{flex:1;height:22px;border-radius:3px;background:var(--soft)}
.heat i.l1{background:var(--accent-soft)}.heat i.l2{background:var(--accent);opacity:.45}.heat i.l3{background:var(--accent)}
.heat-sum{font-size:11.5px;color:var(--ink3);margin-top:7px}
/* 回看页一句话总结（事件维度上方） */
.rev-sum{margin-top:12px;background:var(--accent-soft);border-radius:var(--r-card);padding:3px 16px}
.rev-row{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.rev-row:last-child{border-bottom:none}
.rev-k{display:flex;align-items:center;gap:5px;flex-shrink:0;width:72px;font-size:12px;font-weight:700;color:var(--ink2)}
.rev-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.rev-v{font-size:13px;color:var(--ink);font-weight:600;line-height:1.4;flex:1;min-width:0;word-break:break-word}
/* 回看页：事件为第一维度，维度嵌套在事件下，整块可折叠 */
.evfold{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.evfold-h{display:flex;align-items:center;gap:8px;padding:14px 16px;cursor:pointer;user-select:none}
.evfold-h .evfold-t{font-size:14px;font-weight:700;color:var(--ink)}
.evfold-h .evfold-c{font-size:12px;color:var(--ink3)}
.evfold-h .evfold-chev{margin-left:auto;font-size:11px;color:var(--ink3);transition:transform .18s}
.evfold.open .evfold-chev{transform:rotate(90deg)}
.evfold-b{padding:8px 16px 14px}
/* 事件分组（第一维度） */
.ev-grp{margin-top:11px}
.ev-grp:first-child{margin-top:2px}
.ev-grp-h{display:flex;align-items:baseline;gap:8px}
.ev-grp-h .ev-gn{font-size:14px;font-weight:700;color:var(--ink)}
.ev-grp-h .ev-gc{font-size:11.5px;font-weight:700;color:var(--ink3)}
/* 维度分组（第二维度，嵌套在事件下，支持跨维度） */
.ev-dim{margin:7px 0 2px 10px;padding-left:10px;border-left:2px solid var(--line2)}
.ev-dim-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:3px}
.ev-dim-h .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ev-dim-h .ev-dim-c{font-size:11px;font-weight:700;color:var(--ink3)}
.ev-row{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ink2);padding:3px 0}
.ev-row .ev-d{flex-shrink:0;color:var(--ink3);font-variant-numeric:tabular-nums}
.ev-row .ev-x{color:var(--ink)}

/* 设置 */
.srow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.srow .sl{flex:1;font-size:14.5px}
.srow .ss{font-size:12px;color:var(--ink3);margin-top:1px}
.srow .sr{font-size:13px;color:var(--accent);cursor:pointer}
.srow .sv{font-size:13px;color:var(--ink3);flex-shrink:0}
.empty-mini{font-size:12.5px;color:var(--ink3);padding:10px 0 4px}
.danger{color:var(--danger)!important}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.po{font-size:12.5px;padding:5px 11px;border-radius:99px;background:var(--soft);color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.po .x{color:var(--ink3);cursor:pointer;font-size:13px;line-height:1}
.po .x:hover{color:var(--danger)}

/* 选项管理浮层 */
.sheet{position:absolute;left:0;right:0;top:0;bottom:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:0}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:15px 22px 2px;flex-shrink:0}
.sh-h .st{font-size:17px;font-weight:800;letter-spacing:-.01em}
.sh-h .sx{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--ink2);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s,color .15s}
.sh-h .sx:hover{background:#E9E6DC;color:var(--ink)}
.sh-sub{font-size:12px;color:var(--ink3);padding:0 22px 12px;flex-shrink:0}
.sh-list{flex:1;overflow-y:auto;padding:2px 22px 4px}
.sh-list::-webkit-scrollbar{width:4px}
.sh-list::-webkit-scrollbar-thumb{background:#DAD6CA;border-radius:3px}
.opt-row{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px}
.opt-row .ov{flex:1;min-width:0;font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt-row .mini-in{flex:1;min-width:0}
.opt-row .mini-b{flex-shrink:0}
.sh-empty{font-size:12.5px;color:var(--ink3);text-align:center;padding:28px 0}
.sh-newrow{flex-shrink:0;padding:10px 22px 0;border-top:1px solid var(--line)}
.sh-foot{flex-shrink:0;padding:10px 22px 16px;display:flex}
.sheet .undoline{margin:0 22px 10px;flex-shrink:0}
.undoline{margin-top:9px;background:var(--soft);border-radius:12px;padding:9px 12px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.undoline .tx{flex:1}
.undoline .tb{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline}

/* 底部导航 */
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--bg);flex-shrink:0;padding:6px 0 10px}
.tbb{flex:1;text-align:center;font-size:12px;color:var(--ink3);cursor:pointer;padding:9px 0 5px;position:relative;transition:color .15s}
.tbb.on{color:var(--accent);font-weight:800}
.tbb.on::before{content:'';position:absolute;top:3px;left:50%;transform:translateX(-50%);width:16px;height:2.5px;border-radius:99px;background:var(--accent)}
.tbb:hover{color:var(--ink2)}
@media(hover:hover){
  .chip:hover,.ft:hover,.tg:hover{border-color:#CFCABC}
  .mini-b:hover{border-color:#CFCABC;color:var(--ink2)}
  .mini-b.del:hover{color:var(--danger);border-color:#DCC0BE}
  .sg:hover{background:var(--accent-soft);color:var(--accent)}
}
.tbb .ic{display:block;font-size:15px;line-height:1.3}

/* ---------- 右侧说明 ---------- */
.notes{background:#fff;border:1px solid var(--line2);border-radius:20px;padding:22px 24px}
.notes h3{font-size:17px;font-weight:800;margin-bottom:4px}
.notes .ns{font-size:12.5px;color:var(--ink3);margin-bottom:16px}
.npanel{display:none}
.npanel.on{display:block}
.nb{margin-bottom:15px}
.nb .nt{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.06em;margin-bottom:5px}
.nb .nd{font-size:13.5px;color:var(--ink2);line-height:1.75}
.nb ul{margin:4px 0 0 17px}

/* 看页统计：跟着筛选走，选了哪个模块就显示哪个模块的原有统计 */
function statsBlock(){
  var f=st.filter,i,h;
  if(f==='all'){
    var counts=MODULES.map(function(m){return {n:st.recs.filter(function(r){return r.m===m.k}).length,nm:m.n,c:m.c}});
    var mx=1;
    for(i=0;i<counts.length;i++){if(counts[i].n>mx)mx=counts[i].n}
    h='<div class="sect-t">统计 · 全部</div><div class="bars">'
      +'<div class="st-sum">共 '+st.recs.length+' 条</div>'
      +counts.map(function(c){return barRow(c.nm,c.n,mx,c.c)}).join('')
      +'</div>';
    return h;
  }
  var list=st.recs.filter(function(r){return r.m===f});
  var acc={};
  list.forEach(function(r){acc[r.txt]=(acc[r.txt]||0)+1});
  var keys=Object.keys(acc).sort(function(a,b){return acc[b]-acc[a]}).slice(0,4);
  var mxv=keys.length?acc[keys[0]]:1;
  var label={obs:'观察最多的事',now:'最常在做的事',want:'最常想做的事',nope:'最常不想的事',done:'做得最多的事'}[f];
  h='<div class="sect-t">统计 · '+mname(f)+'</div><div class="bars">'
    +(keys.length?'<div class="st-sum">'+label+'：<b>'+esc(keys[0])+'</b> · '+acc[keys[0]]+' 次</div>':'<div class="st-sum">这个模块还没有记录</div>')
    +keys.map(function(k){return barRow(k,acc[k],mxv,mcolor(f))}).join('');
  if(f==='obs'&&list.length){
    var fg=list.filter(function(r){return (r.ext||[]).indexOf('忘了时间')>=0}).length;
    var chg=list.filter(function(r){return (r.ext||[]).indexOf('充电')>=0}).length;
    var tire=list.filter(function(r){return (r.ext||[]).indexOf('耗电')>=0}).length;
    h+='<div class="st-ex">忘了时间 '+fg+'/'+list.length+'（'+Math.round(fg/list.length*100)+'%） · 充电 '+chg+' · 耗电 '+tire+'</div>';
  }
  h+='</div>';
  return h;
}

/* 回看页总结：从真实记录里提炼 6 个关键面，以行式表格呈现（标签+值+维度色点），数据驱动、无写死 */
function reviewSummary(){
  function extAcc(ext){
    var a={};
    st.recs.forEach(function(r){
      if(r.m==='obs'&&(r.ext||[]).indexOf(ext)>=0)a[r.txt]=(a[r.txt]||0)+1;
    });
    return a;
  }
  function modAcc(m){
    var a={};
    st.recs.forEach(function(r){if(r.m===m)a[r.txt]=(a[r.txt]||0)+1;});
    return a;
  }
  function leader(a){
    var ks=Object.keys(a); if(!ks.length)return null;
    var mx=0; ks.forEach(function(k){if(a[k]>mx)mx=a[k];});
    return ks.filter(function(k){return a[k]===mx;}).join('、');
  }
  var immerse=leader(extAcc('忘了时间'));
  var drain=leader(extAcc('耗电'));
  var charge=leader(extAcc('充电'));
  var want=leader(modAcc('want'));
  var nope=leader(modAcc('nope'));
  var doneTop=leader(modAcc('done'));
  var cObs=MODULES[0].c, cWant=MODULES[2].c, cNope=MODULES[3].c, cDone=MODULES[4].c;
  var rows=[
    {k:'沉浸最深', c:cObs,  v:immerse},
    {k:'耗能最多', c:cObs,  v:drain},
    {k:'充电最多', c:cObs,  v:charge},
    {k:'最想做',   c:cWant, v:want},
    {k:'最不想做', c:cNope, v:nope},
    {k:'做得最多', c:cDone, v:doneTop}
  ];
  return rows.map(function(r){
    return '<div class="rev-row">'
      +'<span class="rev-k"><i class="rev-dot" style="background:'+r.c+'"></i>'+r.k+'</span>'
      +'<span class="rev-v">'+(r.v||'—')+'</span></div>';
  }).join('');
}
/* 热力图：按记录的 ago 真实统计，不再是写死的循环序列 */
function heatData(){
  var cnt=[],i,mx=1,act=0;
  for(i=0;i<30;i++)cnt.push(0);
  st.recs.forEach(function(r){
    var a=(r.ago==null?0:r.ago);
    if(a>=0&&a<30)cnt[29-a]++;
  });
  for(i=0;i<30;i++){if(cnt[i]>mx)mx=cnt[i];if(cnt[i])act++}
  return {cnt:cnt,mx:mx,act:act};
}
function heat(){
  var d=heatData(),s='',i,n,lv;
  for(i=0;i<30;i++){
    n=d.cnt[i];
    lv=n?(d.mx<=1?2:(n===d.mx?3:(n*2>=d.mx?2:1))):0;
    s+='<i class="'+(lv?'l'+lv:'')+'" title="'+dayLabel(29-i)+' · '+n+' 条"></i>';
  }
  return s;
}
function heatSum(){
  var d=heatData();
  if(!d.act)return '近 30 天还没有记录';
  return '近 30 天有记录 '+d.act+' 天 · 最多一天 '+d.mx+' 条';
}
/* 回看页：事件为第一维度，维度（观察/此刻/想做/不想/做了）嵌套在事件下，支持跨维度；整块可折叠 */
function evByDim(){
  var total=st.recs.length, html='';
  /* 先按事件（txt）聚合 */
  var groups={}, keys=[];
  st.recs.forEach(function(r){
    if(!groups[r.txt]){groups[r.txt]={minAgo:r.ago,count:0,mods:{}};keys.push(r.txt);}
    var g=groups[r.txt];
    if(r.ago<g.minAgo)g.minAgo=r.ago;
    g.count++;
    (g.mods[r.m]=g.mods[r.m]||[]).push(r);
  });
  /* 排序：最近发生的事件排前，其次出现次数多排前 */
  keys.sort(function(a,b){var x=groups[a],y=groups[b];
    return x.minAgo!==y.minAgo?x.minAgo-y.minAgo:(y.count-x.count)});
  keys.forEach(function(txt){
    var g=groups[txt], dimHtml='';
    MODULES.forEach(function(m){
      var rs=g.mods[m.k];
      if(!rs||!rs.length)return;
      rs.sort(function(a,b){return a.ago!==b.ago?a.ago-b.ago:(b.t||'').localeCompare(a.t||'')});
      var rows=rs.map(function(r){
        var det=extHTML(r);
        return '<div class="ev-row"><span class="ev-d">'+esc(r.t)+' · '+esc(r.day)+'</span>'
          +'<span class="ev-x">'+det+'</span></div>';
      }).join('');
      dimHtml+='<div class="ev-dim">'
        +'<div class="ev-dim-h"><i class="dot" style="background:'+m.c+'"></i>'+m.n+'<span class="ev-dim-c">'+rs.length+'</span></div>'
        +rows+'</div>';
    });
    html+='<div class="ev-grp">'
      +'<div class="ev-grp-h"><span class="ev-gn">'+esc(txt)+'</span><span class="ev-gc">'+g.count+'</span></div>'
      +dimHtml+'</div>';
  });
  return '<div class="evfold'+(st.evOpen?' open':'')+'" id="evfold">'
    +'<div class="evfold-h" id="evfoldh">'
      +'<span class="evfold-t">事件</span>'
      +'<span class="evfold-c">'+total+' 条 · '+keys.length+' 个</span>'
      +'<span class="evfold-chev">▸</span>'
    +'</div>'
    +(st.evOpen?'<div class="evfold-b">'+html+'</div>':'')
  +'</div>';
}

function renameOpt(g,oldV,nv){
  nv=nv.trim();
  st.ren=null;
  if(!nv||nv===oldV){render();return}
  var i=OPT[g].indexOf(oldV);
  if(i>-1){OPT[g][i]=nv;V2.renOpt(g,oldV,nv);}
  st.recs.forEach(function(r){
    if(r.txt===oldV)r.txt=nv;
    if(r.ext)r.ext=r.ext.map(function(x){return x===oldV?nv:x});
  });
  if(st.mainPick===oldV)st.mainPick=nv;
  Object.keys(st.pick).forEach(function(k){
    st.pick[k]=(st.pick[k]||[]).map(function(x){return x===oldV?nv:x});
  });
  render();
}
function delOpt(g,v){
  OPT[g]=OPT[g].filter(function(x){return x!==v});V2.rmOpt(g,v);
  if(st.mainPick===v)st.mainPick=null;
  Object.keys(st.pick).forEach(function(k){
    st.pick[k]=(st.pick[k]||[]).filter(function(x){return x!==v});
  });
  st.optUndo={g:g,v:v};
  render();
}

function bind(){
  var i,els;
  els=document.querySelectorAll('.tbb');
  for(i=0;i<els.length;i++){(function(e){e.onclick=function(){st.scr=e.getAttribute('data-scr');render()}})(els[i])}
  var efh=$('#evfoldh'); if(efh) efh.onclick=function(){st.evOpen=!st.evOpen;render()};
  els=document.querySelectorAll('.tg');
  for(i=0;i<els.length;i++){(function(e){e.onclick=function(){
    st.tag=e.getAttribute('data-tag');
    st.main='';st.mainPick=null;st.pick={};st.typed={};st.free={};
    render();
  }})(els[i])}
  /* 主项选项：点选即选中，手填覆盖 */
  els=document.querySelectorAll('.chip[data-main]');
  for(i=0;i<els.length;i++){(function(e){e.onclick=function(){
    var v=e.getAttribute('data-v');
    st.mainPick=(st.mainPick===v?null:v);
    if(st.mainPick)st.main='';
    render();
  }})(els[i])}
  /* 细节选项：单选组互斥，多选组叠加 */
  els=document.querySelectorAll('.chip[data-g]');
  for(i=0;i<els.length;i++){(function(e){e.onclick=function(){
    var g=e.getAttribute('data-g'),v=e.getAttribute('data-v');
    var arr=st.pick[g]||(st.pick[g]=[]);
    var j=arr.indexOf(v);
    if(j>-1){arr.splice(j,1)}
    else{if(isSingle(g))arr.length=0;arr.push(v)}
    render();
  }})(els[i])}
  var sv=$('#save'); if(sv) sv.onclick=doSave;
  var inp=$('#in');
  if(inp){
    inp.value=st.main;
    inp.oninput=function(){
      st.main=inp.value;
      if(inp.value.trim())st.mainPick=null;
      render();
      var ip2=$('#in');
      if(ip2){ip2.focus();ip2.setSelectionRange(ip2.value.length,ip2.value.length)}
    };
    inp.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSave()}};
  }
  els=document.querySelectorAll('[data-typed]');
  for(i=0;i<els.length;i++){(function(e){
    var g=e.getAttribute('data-typed');
    e.value=st.typed[g]||'';
    e.oninput=function(){st.typed[g]=e.value};
  })(els[i])}
  els=document.querySelectorAll('[data-free]');

  /* 主项：点选的不动池子；手填默认只记这次；加 ~ / ～ 前缀才固化进选项池 */

    OPT[f.main].push(mv);V2.addOpt(f.main,mv);

      var sel=(st.pick[it.g]||[]).slice();
      var traw=(st.typed[it.g]||'').trim(), tOnce=isOnce(traw);
      var tv=tOnce?traw.slice(1).trim():traw;

function parseImport(txt){
  var lines=String(txt||'').split(/\r?\n/), out=[], bad=0, N2K={};
  MODULES.forEach(function(m){N2K[m.n]=m.k});
  lines.forEach(function(ln){
    ln=ln.trim(); if(!ln||ln.charAt(0)==='#')return;
    /* 分隔符优先级：|（导出格式，内容里的「·」安全）> ·（手写兼容） */
    var p=(ln.indexOf('|')>=0?ln.split(/\s*\|\s*/):ln.split(/\s*·\s*/));
    if(p.length<3||!p[2].trim()){bad++;return}
    var head=p[0].trim(), mk=p[1].trim(), main=p[2].trim();
    var ext=p.length>3?p.slice(3).join(' | ').split(/[、,，]/).map(function(x){return x.trim()}).filter(function(x){return x}):[];
    var k=N2K[mk]||mk;
    if(!FIELDS[k]){bad++;return}
    var mm=head.match(/(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{1,2}):(\d{2}))?/);
    var ts=Date.now(), t='';
    if(mm){
      var d=new Date(+mm[1],+mm[2]-1,+mm[3],mm[4]?+mm[4]:0,mm[5]?+mm[5]:0,0);
      ts=d.getTime(); t=mm[4]?('0'+(+mm[4])).slice(-2)+':'+mm[5]:'';
    }else if(/^\d{1,2}:\d{2}$/.test(head)){t=head}
    else{t=head}
    out.push({m:k,t:t,txt:main,ext:ext,
              extSrc:ext.map(function(v){var g=grpOf(v,k);return g||('fallback:'+k)}),
              ts:ts,bn:N2K[mk]?'':mk});
  });
  return {recs:out,bad:bad};
}
function pushRecs(list){
  var ok=[],n=0;
  list.forEach(function(r){
    if(!FIELDS[r.m]||!String(r.txt||'').trim())return;
    var nr={id:++st.seq,m:r.m,t:r.t||'',txt:String(r.txt).trim(),ext:(r.ext||[]).slice(),
            extSrc:(r.extSrc||[]).slice(),ts:r.ts||Date.now(),bn:r.bn||''};
    nr.ago=0; nr.day='今天';
    st.recs.unshift(nr); ok.push(nr); n++;
  });
  if(n){
    st.recs.sort(function(a,b){return (b.ts||0)-(a.ts||0)});
    V2.addMany(ok,function(){stat2('已导入 '+n+' 条')});
  }
  return n;
}
function stat2(t){st.stat=t;var e=document.getElementById('v2stat');if(e)e.textContent=t}
function doImport(){
  var d=overlay('导入记录',
      '<div class="sh-sub">粘贴导出的文本或 JSON，一行一条</div>'
    + '<div class="ovl-body"><textarea class="ta" id="impTa" placeholder="2025-09-30 08:12 | 做了 | 跑步 | 踏实、完成感"></textarea>'
    + '<div class="hint">· 文本：日期 时间 | 维度 | 内容 | 细节（细节用顿号分隔；也认中文间隔号「·」）<br>· JSON：会同时恢复自定义维度与选项池<br>· 只新增，不会覆盖已有记录</div></div>'
    + '<div class="ovl-foot"><button class="btn gh" id="impCancel">取消</button><button class="btn" id="impGo">导入</button></div>');
  document.getElementById('impCancel').onclick=closeOverlay;
  document.getElementById('impGo').onclick=function(){
    var ta=document.getElementById('impTa'), txt=ta?ta.value:'';
    if(!txt.trim()){toast('先粘贴内容');return}
    var n=0;
    if(txt.trim().charAt(0)==='{'){
      var data=null;
      try{data=JSON.parse(txt)}catch(e){toast('JSON 解析失败');return}
      (data.dims||[]).forEach(function(x){regDim(x)}); persistDims();
      if(data.opt)for(var g in data.opt){
        if(OPT[g]===undefined)OPT[g]=[];
        (data.opt[g]||[]).forEach(function(v){if(OPT[g].indexOf(v)<0){OPT[g].push(v);V2.addOpt(g,v)}});
      }
      n=pushRecs(data.recs||[]);
    }else{
      var pr=parseImport(txt); n=pushRecs(pr.recs);
      if(pr.bad)toast('导入 '+n+' 条 · '+pr.bad+' 行无法识别');
      else toast('已导入 '+n+' 条');
      closeOverlay(); render(); return;
    }
    toast('已导入 '+n+' 条');
    closeOverlay(); render();
  };
}
function doClear(){
  if(!st.recs.length){toast('当前没有记录');return}
  var n1=window.confirm('确定清空全部 '+st.recs.length+' 条记录？\n\n云端与本地都会删除，不可恢复。建议先导出备份。');
  if(!n1)return;
  var n2=window.confirm('再确认一次：真的要清空吗？');
  if(!n2)return;
  stat2('清空中…');
  V2.clearAll(function(cnt){
    st.recs=[]; st.seq=1; st.saved=null;
    try{localStorage.removeItem('v2_recs_'+V2.dbId)}catch(e){}
    toast('已清空 '+cnt+' 条');
    stat2('已清空');
    render();
  });
}
function doAddTag(){
  var sw=DCOLORS.map(function(c,i){return '<span class="sw'+(i===0?' on':'')+'" data-c="'+esc(c)+'" style="background:'+c+'"></span>'}).join('');
  var d=overlay('新增维度',
      '<div class="sh-sub">维度就是原来的「模块」，会顺次排在后面</div>'
    + '<div class="ovl-body"><input class="mini-in" id="dimName" placeholder="给这个维度起个名字，比如「带娃」" style="box-sizing:border-box;margin-bottom:6px">'
    + '<div class="swatches" id="dimSw">'+sw+'</div>'
    + '<div class="hint">· 新维度带一个「内容」选项池和一个「补充」自由输入框<br>· 默认只记这次，加 ~ 前缀才会存进选项池，下次可点选</div></div>'
    + '<div class="ovl-foot"><button class="btn gh" id="dimCancel">取消</button><button class="btn" id="dimGo">新增</button></div>');
  var pick=DCOLORS[0];
  var sws=d.querySelectorAll('.sw');
  for(var i=0;i<sws.length;i++){(function(e){
    e.onclick=function(){
      pick=e.getAttribute('data-c');
      var all=d.querySelectorAll('.sw');
      for(var j=0;j<all.length;j++)all[j].classList.remove('on');
      e.classList.add('on');
    };
  })(sws[i])}
  document.getElementById('dimCancel').onclick=closeOverlay;
  var nm=document.getElementById('dimName'); if(nm)nm.focus();
  function go(){
    var v=(nm&&nm.value||'').trim();
    if(!v){toast('先起个名字');return}
    var k='c'+Date.now().toString(36);
    if(!regDim({k:k,n:v,c:pick,opt:[]})){toast('新增失败');return}
    persistDims();
    closeOverlay(); render();
    toast('已新增维度「'+v+'」');
  }
  document.getElementById('dimGo').onclick=go;
  if(nm)nm.onkeydown=function(e){if(e.key==='Enter')go()};
}
restoreDims();
applyTheme(curTheme());
bindGreetRotate();
V2.boot();
render();
/* 调试出口：控制台可 __v2.exportText() / __v2.OPT / __v2.st */
window.__v2={st:st,OPT:OPT,MODULES:MODULES,FIELDS:FIELDS,render:render,exportText:exportText,exportJSON:exportJSON,parseImport:parseImport,dimList:dimList,boot:V2.boot};
})();
</script>
